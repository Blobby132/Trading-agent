[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagent"
version = "0.1.0"
description = "A compounding trading agent and an honest walk-forward backtest framework"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.28",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
dev = ["pytest>=7.0"]

[project.scripts]
tradingagent = "tradingagent.cli:main"

[tool.setuptools]
packages = ["tradingagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
